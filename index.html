<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boulder Dash WebXR - Fixed</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
    }
  }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #vr-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    #debug-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.75);
      color: #00ff00;
      font: 12px monospace;
      white-space: pre-line;
      z-index: 20;
      pointer-events: none;
    }

    #help {
      position: absolute;
      right: 10px;
      top: 10px;
      padding: 10px;
      color: white;
      background: rgba(0, 0, 0, 0.65);
      font-size: 13px;
      line-height: 1.6;
      z-index: 5;
    }

    /* Level Selection UI Styles */
    .level-option {
      margin: 10px 0;
      padding: 12px 24px;
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid #00ff00;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .level-option:hover {
      background: rgba(0, 0, 0, 0.7);
      transform: scale(1.05);
    }
  .level-title {
  font-weight: bold;
  margin-bottom: 4px;
}
.level-description {
  font-size: 0.9em;
  opacity: 0.8;
}
</style>
</head>

<body>
  <div id="vr-button"></div>
  <div id="debug-panel">Initializing game...</div>
  <div id="help">
    WASD: Move<br>
    Shift + WASD: Dig<br>
    VR trigger: Interact
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';

    // --------------------------------------------------
    // LEVELS
    // --------------------------------------------------

    // Generator functions
    function generateGrid(width, height) {
      // Create a grid filled with empty ('.')
      const grid = Array.from({ length: height }, () => Array(width).fill('.'));

      // Set borders to walls
      for (let x = 0; x < width; x++) {
        grid[0][x] = 'W';
        grid[height-1][x] = 'W';
      }
      for (let y = 0; y < height; y++) {
        grid[y][0] = 'W';
        grid[y][width-1] = 'W';
      }

      // Randomly place dirt inside (with probability 0.3)
      for (let y = 1; y < height-1; y++) {
        for (let x = 1; x < width-1; x++) {
          if (Math.random() < 0.3) {
            grid[y][x] = 'D';
          }
        }
      }

      return grid;
    }

    function createLevelPreview(level) {
      // Generate a simple color preview as a data URL
      // We'll create a 20x20 pixel canvas and fill it with a color based on the level index
      const canvas = document.createElement('canvas');
      canvas.width = 20;
      canvas.height = 20;
      const ctx = canvas.getContext('2d');
      // Use hue based on level index to get a variety of colors
      const hue = (level.index * 30) % 360; // 0-360
      ctx.fillStyle = `hsl(${hue}, 70%, 50%)`;
      ctx.fillRect(0, 0, 20, 20);
      return canvas.toDataURL();
    }

    function generateLevel(index) {
      // Deterministic but varying parameters based on index
      const width = 8 + (index % 5); // 8-12
      const height = 8 + ((index * 7) % 5); // 8-12

      const timeLimit = 30 + index * 5; // 30, 35, 40, ... up to 30+29*5=175
      const diamondsRequired = 1 + (index % 5); // 1-5

      // Generate grid
      const grid = generateGrid(width, height);

      // Place player at (1,1) - make sure it's empty
      grid[1][1] = '.';

      // Place diamonds
      const diamonds = [];
      for (let i = 0; i < diamondsRequired; i++) {
        let pos;
        do {
          pos = {
            x: 1 + Math.floor(Math.random() * (width-2)),
            y: 1 + Math.floor(Math.random() * (height-2))
          };
        } while (grid[pos.y][pos.x] !== '.' ||
                 (pos.x === 1 && pos.y === 1) || // player start
                 diamonds.some(d => d.x === pos.x && d.y === pos.y));
        grid[pos.y][pos.x] = '.'; // keep the ground as empty (diamond is an object)
        diamonds.push({ type: 'diamond', x: pos.x, y: pos.y });
      }

      // Place boulders (number = diamondsRequired + 2)
      const boulders = [];
      const boulderCount = diamondsRequired + 2;
      for (let i = 0; i < boulderCount; i++) {
        let pos;
        do {
          pos = {
            x: 1 + Math.floor(Math.random() * (width-2)),
            y: 1 + Math.floor(Math.random() * (height-2))
          };
        } while (grid[pos.y][pos.x] !== '.' ||
                 (pos.x === 1 && pos.y === 1) || // player start
                 diamonds.some(d => d.x === pos.x && d.y === pos.y) ||
                 boulders.some(b => b.x === pos.x && b.y === pos.y));
        grid[pos.y][pos.x] = '.'; // keep ground empty
        boulders.push({ type: 'boulder', x: pos.x, y: pos.y });
      }

      const objects = [
        { type: 'player', x: 1, y: 1 },
        ...diamonds,
        ...boulders
      ];

      // Title and description
      const title = `Level ${index + 1}`;
      const description = `A procedurally generated level with ${width}x${height} grid, ${diamondsRequired} diamonds to collect, and ${timeLimit} seconds.`;

      // Preview image
      const previewImage = createLevelPreview({ index, width, height, diamondsRequired, timeLimit });

      return {
        width,
        height,
        timeLimit,
        diamondsRequired,
        grid,
        objects,
        title,
        description,
        previewImage
      };
    }

    function generateLevels(count) {
      const levels = [];
      for (let i = 0; i < count; i++) {
        levels.push(generateLevel(i));
      }
      return levels;
    }

    const LEVELS = generateLevels(30);

    // Current level tracking
    let currentLevelIndex = 0;
    let levelData = null;

    // Level completion tracking
    let collectedDiamondCount = 0;
    let completedLevels = []; // for save/load

    // --------------------------------------------------
    // CONSTANTS AND STATE
    // --------------------------------------------------

    const TILE_SIZE = 0.5;
    const EMPTY = 0;
    const DIRT = 1;
    const WALL = 2;

    const TICK = 0.1;

    let scene;
    let camera;
    let renderer;

    let controller1;
    let controller2;
    let laser1;
    let laser2;

    let grid = [];
    let tiles = [];
    let gameObjects = [];

    let playerX = 1;
    let playerZ = 1;

    let accumulator = 0;
    let lastTime = 0;
    let frameCount = 0;
    let errorMessage = null;
    let playerObject = null;
    let isDigging = false;
    let diggingTimer = 0;
    const digDuration = 0.2; // seconds
    let lastMoveDir = {x: 0, z: 0};
    let playerJustMoved = false;

    const keys = {
      w: false,
      a: false,
      s: false,
      d: false,
      Shift: false
    };

    const raycaster = new THREE.Raycaster();
    const tempMatrix = new THREE.Matrix4();

    // Save/Load Game State
    function saveGameState() {
      const saveData = {
        completedLevels: completedLevels,
        currentLevelIndex: currentLevelIndex
      };
      localStorage.setItem('boulderDashSave', JSON.stringify(saveData));
    }

    function loadGameState() {
      const saveData = localStorage.getItem('boulderDashSave');
      if (saveData) {
        const data = JSON.parse(saveData);
        completedLevels = data.completedLevels || [];
        currentLevelIndex = data.currentLevelIndex || 0;
      } else {
        // Initialize if no save data
        completedLevels = [];
        currentLevelIndex = 0;
      }
    }

    // Load saved game state
    loadGameState();

    // --------------------------------------------------
    // UTILITIES
    // --------------------------------------------------

    function worldX(x) {
      return (x - levelData.width / 2 + 0.5) * TILE_SIZE;
    }

    function worldZ(z) {
      return (z - levelData.height / 2 + 0.5) * TILE_SIZE;
    }

    function showError(error) {
      errorMessage = String(error?.stack || error);

      const panel = document.getElementById('debug-panel');
      panel.style.color = '#ff5555';
      panel.textContent = 'ERROR\n' + errorMessage;

      console.error(error);
    }

    function objectAt(x, z, type = null) {
      return gameObjects.find(obj =>
        obj.x === x &&
        obj.z === z &&
        (!type || obj.type === type)
      );
    }

    // --------------------------------------------------
    // GAME OBJECTS
    // --------------------------------------------------

    function createObject(type, x, z) {
      let geometry;
      let material;
      let mesh;

      if (type === 'boulder') {
        geometry = new THREE.SphereGeometry(0.36, 20, 16);
        material = new THREE.MeshStandardMaterial({
          color: 0x777777,
          roughness: 0.9
        });
        mesh = new THREE.Mesh(geometry, material);
      } else if (type === 'player') {
        // Create a group for the player
        mesh = new THREE.Group();

        const bodyHeight = 0.8;
        const bodyRadius = 0.2;
        const bodyGeometry = new THREE.CylinderGeometry(bodyRadius, bodyRadius, bodyHeight, 8);
        const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
        const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
        body.position.y = bodyHeight / 2; // so bottom at y=0
        body.castShadow = true;
        body.receiveShadow = true;
        mesh.add(body);

        const headRadius = 0.2;
        const headGeometry = new THREE.SphereGeometry(headRadius, 8, 8);
        const headMaterial = new THREE.MeshStandardMaterial({ color: 0xffcc00 });
        const head = new THREE.Mesh(headGeometry, headMaterial);
        head.position.y = bodyHeight + headRadius; // on top of body
        head.castShadow = true;
        head.receiveShadow = true;
        mesh.add(head);

        const armWidth = 0.1, armHeight = 0.3, armDepth = 0.1;
        const armGeometry = new THREE.BoxGeometry(armWidth, armHeight, armDepth);
        const armMaterial = new THREE.MeshStandardMaterial({ color: 0xffcc00 });

        const leftArm = new THREE.Mesh(armGeometry, armMaterial);
        leftArm.position.set(-bodyRadius - armWidth/2, bodyHeight/2, 0); // left side, at mid-body height
        leftArm.castShadow = true;
        leftArm.receiveShadow = true;
        mesh.add(leftArm);

        const rightArm = new THREE.Mesh(armGeometry, armMaterial);
        rightArm.position.set(bodyRadius + armWidth/2, bodyHeight/2, 0);
        rightArm.castShadow = true;
        rightArm.receiveShadow = true;
        mesh.add(rightArm);

        const legWidth = 0.1, legHeight = 0.4, legDepth = 0.1;
        const legGeometry = new THREE.BoxGeometry(legWidth, legHeight, legDepth);
        const legMaterial = new THREE.MeshStandardMaterial({ color: 0x0000ff });

        const leftLeg = new THREE.Mesh(legGeometry, legMaterial);
        leftLeg.position.set(-bodyRadius/2, legHeight/2, 0); // inside body footprint
        leftLeg.castShadow = true;
        leftLeg.receiveShadow = true;
        mesh.add(leftLeg);

        const rightLeg = new THREE.Mesh(legGeometry, legMaterial);
        rightLeg.position.set(bodyRadius/2, legHeight/2, 0);
        rightLeg.castShadow = true;
        rightLeg.receiveShadow = true;
        mesh.add(rightLeg);

        // Store references for animation
        mesh.userData = {
          leftLeg: leftLeg,
          rightLeg: rightLeg,
          originalLeftLegPosition: leftLeg.position.clone(),
          originalRightLegPosition: rightLeg.position.clone(),
          body: body,
          head: head,
          leftArm: leftArm,
          rightArm: rightArm,
          animationState: 'idle',
          animationTime: 0
        };
      } else {
        // diamond
        geometry = new THREE.OctahedronGeometry(0.25);
        material = new THREE.MeshStandardMaterial({
          color: 0x00ff66,
          emissive: 0x003311,
          metalness: 0.25,
          roughness: 0.2
        });
        mesh = new THREE.Mesh(geometry, material);
      }

      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.position.set(worldX(x), 0, worldZ(z));
      scene.add(mesh);

      const obj = {
        type,
        mesh,
        x,
        z,
        previousX: x,
        previousZ: z
      };

      gameObjects.push(obj);
      return obj;
    }

    // --------------------------------------------------
    // GRID
    // --------------------------------------------------

    function initGrid(levelData) {
      grid = Array.from(
        { length: levelData.height },
        () => Array(levelData.width).fill(EMPTY)
      );

      tiles = Array.from(
        { length: levelData.height },
        () => Array(levelData.width).fill(null)
      );

      // Rows are Z; columns are X.
      for (let z = 0; z < levelData.height; z++) {
        for (let x = 0; x < levelData.width; x++) {
          const cell = levelData.grid[z][x];

          grid[z][x] =
            cell === 'W' ? WALL :
            cell === 'D' ? DIRT :
            EMPTY;
        }
      }

      playerX = 1;
      playerZ = 1;
      playerObject = null;

      for (const obj of levelData.objects) {
        const createdObj = createObject(obj.type, obj.x, obj.y);
        if (obj.type === 'player') {
          playerX = createdObj.x;
          playerZ = createdObj.z;
          playerObject = createdObj;
        }
      }
    }

    function createGridMeshes() {
      const wallGeometry = new THREE.BoxGeometry(TILE_SIZE, TILE_SIZE, TILE_SIZE);
      const wallMaterial = new THREE.MeshStandardMaterial({
        color: 0x555555
      });

      const dirtGeometry = new THREE.BoxGeometry(TILE_SIZE, 0.12, TILE_SIZE);
      const dirtMaterial = new THREE.MeshStandardMaterial({
        color: 0x8b4513
      });

      for (let z = 0; z < levelData.height; z++) {
        for (let x = 0; x < levelData.width; x++) {
          let mesh = null;

          if (grid[z][x] === WALL) {
            mesh = new THREE.Mesh(wallGeometry, wallMaterial);
            mesh.position.set(worldX(x), TILE_SIZE/2, worldZ(z));
          } else if (grid[z][x] === DIRT) {
            mesh = new THREE.Mesh(dirtGeometry, dirtMaterial);
            mesh.position.set(worldX(x), 0.12/2, worldZ(z));
          }

          if (mesh) {
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            tiles[z][x] = mesh;
          }
        }
      }
    }

    function removeDirt(x, z) {
      if (grid[z][x] !== DIRT) return;

      if (tiles[z][x]) {
        scene.remove(tiles[z][x]);
        tiles[z][x] = null;
      }

      grid[z][x] = EMPTY;
    }

    // --------------------------------------------------
    // PLAYER
    // --------------------------------------------------

    function updateCameraPosition() {
      // Third-person view looking toward the board.
      camera.position.set(
        worldX(playerX),
        5.5,
        worldZ(playerZ) + 6 * TILE_SIZE
      );

      camera.lookAt(
        worldX(playerX),
        0,
        worldZ(playerZ)
      );
    }

    function movePlayer(dx, dz) {
      const x = playerX + dx;
      const z = playerZ + dz;

      if (
        x < 0 || x >= levelData.width ||
        z < 0 || z >= levelData.height
      ) return;

      if (grid[z][x] === WALL) return;

      // Boulder blocks movement.
      if (objectAt(x, z, 'boulder')) return;

      // Collect diamonds.
      const diamond = objectAt(x, z, 'diamond');

      if (diamond) {
        scene.remove(diamond.mesh);
        gameObjects = gameObjects.filter(obj => obj !== diamond);
        collectedDiamondCount++;

        // Check for level completion
        if (levelData.diamondsRequired > 0 && collectedDiamondCount >= levelData.diamondsRequired) {
          completeLevel();
        }
      }

      // Walking through dirt digs it automatically.
      removeDirt(x, z);

      // Store old position for player animation interpolation
      let oldX = playerObject ? playerObject.x : playerX;
      let oldZ = playerObject ? playerObject.z : playerZ;

      playerX = x;
      playerZ = z;

      // Update player object position for smooth animation
      if (playerObject) {
        playerObject.previousX = oldX;
        playerObject.previousZ = oldZ;
        playerObject.x = playerX;
        playerObject.z = playerZ;
      }

      // Store direction for leaning animation
      lastMoveDir.x = dx;
      lastMoveDir.z = dz;

      updateCameraPosition();
    }

    // --------------------------------------------------
    // LEVEL COMPLETION
    // --------------------------------------------------

    function completeLevel() {
      // Show level completion message
      showLevelCompleteUI();

      // Mark current level as completed
      if (!completedLevels.includes(currentLevelIndex)) {
        completedLevels.push(currentLevelIndex);
        saveGameState();
      }

      // Wait briefly then proceed to next level (in a real game, you might wait for player input)
      setTimeout(() => {
        hideLevelCompleteUI();
        loadNextLevel();
      }, 2000); // 2 second delay to show completion message
    }

    function loadNextLevel() {
      currentLevelIndex++;
      if (currentLevelIndex >= LEVELS.length) {
        currentLevelIndex = 0; // Loop back to first level
      }

      // Reset game state for new level
      resetLevel();
    }

    function resetLevel() {
      // Clear existing game objects and meshes
      gameObjects.forEach(obj => {
        if (obj.mesh) {
          scene.remove(obj.mesh);
        }
      });
      gameObjects = [];

      // Clear existing tile meshes
      tiles.forEach(row => {
        row.forEach(tile => {
          if (tile) {
            scene.remove(tile);
          }
        });
      });

      // Reset tiles array
      tiles = Array.from(
        { length: levelData.height },
        () => Array(levelData.width).fill(null)
      );

      // Reload level data
      levelData = JSON.parse(JSON.stringify(LEVELS[currentLevelIndex]));
      initGrid(levelData);

      // Reset diamond counting
      collectedDiamondCount = 0;

      // Recreate grid meshes
      createGridMeshes();

      // Reset player position (will be set in initGrid)
      updateCameraPosition();

      // Hide any UI and show debug panel
      hideUI();
      document.getElementById('debug-panel').style.display = 'block';
    }

    function digAdjacent(dx, dz) {
      const x = playerX + dx;
      const z = playerZ + dz;

      if (
        x < 0 || x >= levelData.width ||
        z < 0 || z >= levelData.height
      ) return;

      if (objectAt(x, z)) return;

      removeDirt(x, z);
    }

    // --------------------------------------------------
    // KEYBOARD
    // --------------------------------------------------

    function onKeyDown(event) {
      const keyMap = {
        KeyW: 'w',
        KeyA: 'a',
        KeyS: 's',
        KeyD: 'd',
        ShiftLeft: 'Shift',
        ShiftRight: 'Shift'
      };

      const key = keyMap[event.code];
      if (!key) return;

      event.preventDefault();

      // Avoid moving repeatedly from key-repeat events.
      if (keys[key]) return;

      keys[key] = true;

      if (key === 'Shift') return;

      const directions = {
        w: [0, -1],
        s: [0, 1],
        a: [-1, 0],
        d: [1, 0]
      };

      const [dx, dz] = directions[key];

      if (keys.Shift) {
        digAdjacent(dx, dz);
      } else {
        movePlayer(dx, dz);
      }
    }

    function onKeyUp(event) {
      const keyMap = {
        KeyW: 'w',
        KeyA: 'a',
        KeyS: 's',
        KeyD: 'd',
        ShiftLeft: 'Shift',
        ShiftRight: 'Shift'
      };

      const key = keyMap[event.code];

      if (key) keys[key] = false;
    }

    // --------------------------------------------------
    // BOULDER GRAVITY
    // --------------------------------------------------

    function updateLogic() {
      for (const obj of gameObjects) {
        obj.previousX = obj.x;
        obj.previousZ = obj.z;
      }

      // Detect player movement for animation
      if (playerObject) {
        playerJustMoved = (playerObject.x !== playerObject.previousX) || (playerObject.z !== playerObject.previousZ);
      } else {
        playerJustMoved = false;
      }

      // Reverse order prevents lower boulders being updated
      // before upper boulders in the same tick.
      const boulders = gameObjects
        .filter(obj => obj.type === 'boulder')
        .sort((a, b) => a.z - b.z);  // FIXED: was b.z - a.z, now a.z - b.z (ascending z)

      for (const boulder of boulders) {
        const x = boulder.x;
        const belowZ = boulder.z + 1;

        if (belowZ >= levelData.height) continue;

        // Stop on walls or dirt.
        if (grid[belowZ][x] !== EMPTY) continue;

        // Stop above another object or the player.
        if (objectAt(x, belowZ)) continue;

        if (playerX === x && playerZ === belowZ) continue;

        boulder.z = belowZ;
      }
    }

    // --------------------------------------------------
    // VR CONTROLLERS AND LASERS
    // --------------------------------------------------

    function createLaser(controller) {
      const geometry = new THREE.CylinderGeometry(
        0.003, 0.003, 1, 8
      );

      geometry.rotateX(Math.PI / 2);

      const material = new THREE.MeshBasicMaterial({
        color: 0xff3333
      });

      const laser = new THREE.Mesh(geometry, material);

      laser.position.z = -0.5;
      laser.scale.z = 5;
      laser.visible = false;

      controller.add(laser);
      return laser;
    }

    function onSelectStart(event) {
      const controller = event.target;
      const laser = controller === controller1 ? laser1 : laser2;

      if (laser) laser.visible = true;

      tempMatrix.identity().extractRotation(controller.matrixWorld);

      raycaster.ray.origin.setFromMatrixPosition(
        controller.matrixWorld
      );

      raycaster.ray.direction
        .set(0, 0, -1)
        .applyMatrix4(tempMatrix);

      const targets = gameObjects.map(obj => obj.mesh);
      const hits = raycaster.intersectObjects(targets, false);

      if (hits.length > 0) {
        const hitObject = gameObjects.find(
          obj => obj.mesh === hits[0].object
        );

        if (hitObject?.type === 'diamond') {
          hitObject.mesh.material.color.set(0xff0000);
        }
      }
    }

    function onSelectEnd(event) {
      const controller = event.target;
      const laser = controller === controller1 ? laser1 : laser2;

      if (laser) laser.visible = false;

      for (const obj of gameObjects) {
        if (obj.type === 'diamond') {
          obj.mesh.material.color.set(0x00ff66);
        }
      }
    }

    function updateLaser(controller, laser) {
      if (!controller || !laser || !laser.visible) return;

      tempMatrix.identity().extractRotation(controller.matrixWorld);

      raycaster.ray.origin.setFromMatrixPosition(
        controller.matrixWorld
      );

      raycaster.ray.direction
        .set(0, 0, -1)
        .applyMatrix4(tempMatrix);

      const targets = gameObjects.map(obj => obj.mesh);

      for (const row of tiles) {
        for (const tile of row) {
          if (tile) targets.push(tile);
        }
      }

      const hits = raycaster.intersectObjects(targets, false);
      const distance = hits.length
        ? Math.min(hits[0].distance, 5)
        : 5;

      laser.scale.z = distance;
      laser.position.z = -distance / 2;
    }

    // --------------------------------------------------
    // DEBUG PANEL
    // --------------------------------------------------

    function updateDebugPanel() {
      if (errorMessage) return;

      const panel = document.getElementById('debug-panel');

      panel.textContent =
        `Three.js: ${THREE.REVISION}\n` +
        `Level: ${currentLevelIndex + 1}/${LEVELS.length}\n` +
        `Player: (${playerX}, ${playerZ})\n` +
        `Diamonds: ${collectedDiamondCount}/${levelData.diamondsRequired}\n` +
        `Objects: ${gameObjects.length}\n` +
        `Boulders: ${gameObjects.filter(o => o.type === 'boulder').length}\n` +
        `VR active: ${renderer.xr.isPresenting}\n` +
        `Frame: ${frameCount}`;
    }

    // Player animation function
    function applyPlayerAnimation(obj, alpha, delta) {
      // Only animate the player mesh
      if (obj.type !== 'player') return;

      const userData = obj.userData;
      if (!userData) return;

      // Update animation time
      userData.animationTime += delta;

      // Determine animation state based on movement and digging
      let newState = 'idle';
      if (isDigging) {
        newState = 'digging';
      } else if (playerJustMoved) {
        newState = 'walking';
      }

      // If state changed, reset animation time for new state
      if (newState !== userData.animationState) {
        userData.animationState = newState;
        userData.animationTime = 0;
      }

      // Apply animation based on state
      let offsetY = 0;
      let rotationX = 0;
      let rotationZ = 0;

      switch (userData.animationState) {
        case 'idle':
          // Slow bob up and down
          offsetY = Math.sin(userData.animationTime * 2) * 0.02;
          break;
        case 'walking':
          // Faster bob and lean in direction of movement
          offsetY = Math.sin(userData.animationTime * 8) * 0.03;
          // Lean based on last move direction
          rotationX = -lastMoveDir.z * 0.2; // lean forward/back
          rotationZ = lastMoveDir.x * 0.2;   // lean left/right
          break;
        case 'digging':
          // Quick downward punch
          const digProgress = 1.0 - (diggingTimer / digDuration); // 0 to 1
          offsetY = -Math.sin(digProgress * Math.PI) * 0.1; // down then up
          break;
      }

      // Apply offset to the mesh position (we already set position based on interpolation)
      // We'll add an offset on top of the interpolated position
      obj.mesh.position.y += offsetY;

      // Apply rotation (we'll rotate the whole group)
      obj.mesh.rotation.x = rotationX;
      obj.mesh.rotation.z = rotationZ;

      // Animate legs for walking
      if (userData.animationState === 'walking' && userData.leftLeg && userData.rightLeg) {
        // Alternate leg movement
        const legAngle = Math.sin(userData.animationTime * 10) * 0.3; // radians
        userData.leftLeg.rotation.x = legAngle;
        userData.rightLeg.rotation.x = -legAngle;
      } else {
        // Reset leg rotation for idle/digging
        if (userData.leftLeg) userData.leftLeg.rotation.x = 0;
        if (userData.rightLeg) userData.rightLeg.rotation.x = 0;
      }
    }

    // --------------------------------------------------
    // UI FUNCTIONS
    // --------------------------------------------------

    function showLevelCompleteUI() {
      // Create or show level completion overlay
      let overlay = document.getElementById('level-complete-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'level-complete-overlay';
        overlay.style.position = 'absolute';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100%';
        overlay.style.height = '100%';
        overlay.style.backgroundColor = 'rgba(0, 0, 0, 0.7)';
        overlay.style.color = '#00ff00';
        overlay.style.display = 'flex';
        overlay.style.flexDirection = 'column';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.fontSize = '24pt';
        overlay.style.zIndex = '1000';
        overlay.style.textAlign = 'center';
        overlay.style.padding = '20px';
        overlay.style.boxSizing = 'border-box';
        document.body.appendChild(overlay);
      }

      overlay.innerHTML = `
        <div>Level Complete!</div>
        <div>Collected ${collectedDiamondCount}/${levelData.diamondsRequired} diamonds</div>
        <div>Loading next level...</div>
      `;
      overlay.style.display = 'flex';
    }

    function hideLevelCompleteUI() {
      const overlay = document.getElementById('level-complete-overlay');
      if (overlay) {
        overlay.style.display = 'none';
      }
    }

    function showLevelSelectionUI() {
      // Create or show level selection overlay
      let overlay = document.getElementById('level-selection-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'level-selection-overlay';
        overlay.style.position = 'absolute';
        overlay.style.top = '10px';
        overlay.style.right = '10px';
        overlay.style.width = '260px';
        overlay.style.backgroundColor = 'rgba(0, 0, 0, 0.8)';
        overlay.style.color = '#00ff00';
        overlay.style.padding = '10px';
        overlay.style.borderRadius = '4px';
        overlay.style.zIndex = '1000';
        overlay.style.boxSizing = 'border-box';
        document.body.appendChild(overlay);
      }
      overlay.style.display = 'block';

      // Create label and select element
      let html = '<label for="level-select" style="display: block; margin-bottom: 5px; font-weight: bold;">Select Level:</label>';
      html += '<select id="level-select" style="width: 100%; padding: 5px; font-size: 14pt;">';
      LEVELS.forEach((level, index) => {
        html += `<option value="${index}" title="${level.description}">${level.title}</option>`;
      });
      html += '</select>';

      overlay.innerHTML = html;

      // Set current selected level
      const select = overlay.querySelector('#level-select');
      if (select) {
        select.value = currentLevelIndex;
        select.addEventListener('change', (e) => {
          const index = parseInt(e.target.value);
          if (index !== currentLevelIndex) {
            currentLevelIndex = index;
            hideLevelSelectionUI();
            resetLevel();
          }
        });
      }
    }

    function hideLevelSelectionUI() {
      const overlay = document.getElementById('level-selection-overlay');
      if (overlay) {
        overlay.style.display = 'none';
      }
    }

    function hideUI() {
      hideLevelCompleteUI();
      hideLevelSelectionUI();
    }

    // --------------------------------------------------
    // ANIMATION LOOP
    // --------------------------------------------------

    function animate(timeMs) {
      try {
        const time = timeMs / 1000;

        if (lastTime === 0) lastTime = time;

        const delta = Math.min(time - lastTime, 0.25);
        lastTime = time;
        accumulator += delta;

        while (accumulator >= TICK) {
          updateLogic();
          accumulator -= TICK;
        }

        const alpha = accumulator / TICK;

        for (const obj of gameObjects) {
          const x = obj.previousX +
            (obj.x - obj.previousX) * alpha;

          const z = obj.previousZ +
            (obj.z - obj.previousZ) * alpha;

          obj.mesh.position.set(
            worldX(x),
            0,
            worldZ(z)
          );

          // Apply player animation
          applyPlayerAnimation(obj, alpha, delta);
        }

        updateLaser(controller1, laser1);
        updateLaser(controller2, laser2);

        renderer.render(scene, camera);

        frameCount++;
        updateDebugPanel();

        // Update digging timer
        if (isDigging) {
          diggingTimer -= delta;
          if (diggingTimer <= 0) {
            isDigging = false;
          }
        }
      } catch (error) {
        showError(error);
      }
    }

    // --------------------------------------------------
    // INITIALIZATION
    // --------------------------------------------------

    function init() {
      try {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        camera = new THREE.PerspectiveCamera(
          50,
          window.innerWidth / window.innerHeight,
          0.1,
          100
        );

        // Load current level data
        levelData = JSON.parse(JSON.stringify(LEVELS[currentLevelIndex]));
        initGrid(levelData);

        // Initialize diamond counting for level completion
        collectedDiamondCount = 0;

        createGridMeshes();
        updateCameraPosition();

        const hemisphereLight = new THREE.HemisphereLight(
          0xffffff, 0x444444, 1.5
        );
        scene.add(hemisphereLight);

        const directionalLight = new THREE.DirectionalLight(
          0xffffff, 2
        );

        directionalLight.position.set(-3, 10, -10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        renderer = new THREE.WebGLRenderer({
          antialias: true
        });

        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.shadowMap.enabled = true;

        document.body.appendChild(renderer.domElement);

        document.getElementById('vr-button').appendChild(
          VRButton.createButton(renderer, {
            optionalFeatures: ['local-floor', 'bounded-floor']
          })
        );

        controller1 = renderer.xr.getController(0);
        controller1.addEventListener('selectstart', onSelectStart);
        controller1.addEventListener('selectend', onSelectEnd);
        scene.add(controller1);

        controller2 = renderer.xr.getController(1);
        controller2.addEventListener('selectstart', onSelectStart);
        controller2.addEventListener('selectend', onSelectEnd);
        scene.add(controller2);

        laser1 = createLaser(controller1);
        laser2 = createLaser(controller2);

        window.addEventListener('keydown', onKeyDown);
        window.addEventListener('keyup', onKeyUp);

        window.addEventListener('blur', () => {
          for (const key in keys) keys[key] = false;
        });

        window.addEventListener('resize', () => {
          camera.aspect =
            window.innerWidth / window.innerHeight;

          camera.updateProjectionMatrix();

          renderer.setSize(
            window.innerWidth,
            window.innerHeight
          );
        });

        // Show level selection UI on start
        showLevelSelectionUI();

        // Handle number key presses for level selection
        window.addEventListener('keydown', (event) => {
          // Only process number keys when level selection UI is visible
          const levelSelectionOverlay = document.getElementById('level-selection-overlay');
          if (levelSelectionOverlay && levelSelectionOverlay.style.display !== 'none') {
            const key = event.key;
            if (key >= '1' && key <= '9') {
              const levelIndex = parseInt(key) - 1;
              if (levelIndex >= 0 && levelIndex < LEVELS.length && levelIndex !== currentLevelIndex) {
                currentLevelIndex = levelIndex;
                saveGameState();
                hideLevelSelectionUI();
                resetLevel();
              }
            }
          }
        });

        renderer.setAnimationLoop(animate);
      } catch (error) {
        showError(error);
      }
    }

    init();
  </script>
</body>
</html>
