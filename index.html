<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boulder Dash WebXR - Fixed</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
    }
  }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #vr-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    #debug-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.75);
      color: #00ff00;
      font: 12px monospace;
      white-space: pre-line;
      z-index: 20;
      pointer-events: none;
    }

    #help {
      position: absolute;
      right: 10px;
      top: 10px;
      padding: 10px;
      color: white;
      background: rgba(0, 0, 0, 0.65);
      font-size: 13px;
      line-height: 1.6;
      z-index: 5;
    }

    /* Level Selection UI Styles */
    .level-option {
      margin: 10px 0;
      padding: 12px 24px;
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid #00ff00;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .level-option:hover {
      background: rgba(0, 0, 0, 0.7);
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <div id="vr-button"></div>
  <div id="debug-panel">Initializing game...</div>
  <div id="help">
    WASD: Move<br>
    Shift + WASD: Dig<br>
    VR trigger: Interact
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';

    // --------------------------------------------------
    // LEVELS
    // --------------------------------------------------

    const LEVELS = [
      {
        "width": 9,
        "height": 9,
        "timeLimit": 60,
        "diamondsRequired": 1,
        "grid": [
          ["W","W","W","W","W","W","W","W","W"],
          ["W",".",".",".",".",".",".",".","W"],
          ["W",".",".","B",".",".",".",".","W"], // boulder at (2,2)
          ["W",".",".",".",".",".",".",".","W"],
          ["W",".",".",".",".",".",".",".","W"],
          ["W",".",".",".",".",".",".",".","W"],
          ["W",".","D","D","D","D","D",".","W"], // dirt platform at x=2,3,4,5,6
          ["W",".",".",".",".",".",".",".","W"],
          ["W","W","W","W","W","W","W","W","W"]
        ],
        "objects": [
          {"type": "player", "x": 1, "y": 1},
          {"type": "diamond", "x": 4, "y": 5},
          {"type": "boulder", "x": 2, "y": 2}
        ]
      },
      {
        "width": 10,
        "height": 10,
        "timeLimit": 120,
        "diamondsRequired": 2,
        "grid": [
          ["W","W","W","W","W","W","W","W","W","W"],
          ["W",".",".",".",".",".",".",".",".","W"],
          ["W",".",".",".",".",".",".","B",".","W"], // boulder at (2,7)
          ["W",".",".",".",".",".",".",".",".","W"],
          ["W",".",".",".",".",".","D",".",".","W"], // dirt at (6,2)
          ["W",".",".",".",".",".","D",".",".","W"], // dirt at (6,3)
          ["W",".",".",".",".",".","D",".",".","W"], // dirt at (6,4)
          ["W",".",".",".",".",".",".",".",".","W"],
          ["W",".","D","D","D","D","D","D",".","W"], // dirt platform at x=1-7, y=7
          ["W","W","W","W","W","W","W","W","W","W"]
        ],
        "objects": [
          {"type": "player", "x": 1, "y": 1},
          {"type": "diamond", "x": 8, "y": 2},
          {"type": "diamond", "x": 8, "y": 8}
        ]
      },
      {
        "width": 12,
        "height": 8,
        "timeLimit": 90,
        "diamondsRequired": 3,
        "grid": [
          ["W","W","W","W","W","W","W","W","W","W","W","W"],
          ["W",".",".",".",".",".",".",".",".",".",".","W"],
          ["W",".",".","B",".",".",".",".",".",".",".","W"], // boulder at (2,2)
          ["W",".",".",".",".",".",".",".",".",".",".","W"],
          ["W",".",".",".",".",".",".",".",".","D",".","W"], // dirt at (9,3)
          ["W",".",".",".",".",".",".",".",".","D",".","W"], // dirt at (9,4)
          ["W",".",".",".",".",".",".",".",".","D",".","W"], // dirt at (9,5)
          ["W",".","D","D","D","D","D","D","D","D",".","W"], // dirt platform
          ["W","W","W","W","W","W","W","W","W","W","W","W"]
        ],
        "objects": [
          {"type": "player", "x": 1, "y": 1},
          {"type": "diamond", "x": 5, "y": 2},
          {"type": "diamond", "x": 6, "y": 5},
          {"type": "diamond", "x": 10, "y": 6}
        ]
      }
    ];

    // Current level tracking
    let currentLevelIndex = 0;
    let levelData = null;

    // Level completion tracking
    let initialDiamondCount = 0;
    let collectedDiamondCount = 0;

    // --------------------------------------------------
    // CONSTANTS AND STATE
    // --------------------------------------------------

    const TILE_SIZE = 1;
    const EMPTY = 0;
    const DIRT = 1;
    const WALL = 2;

    const TICK = 0.1;

    let scene;
    let camera;
    let renderer;

    let controller1;
    let controller2;
    let laser1;
    let laser2;

    let grid = [];
    let tiles = [];
    let gameObjects = [];

    let playerX = 1;
    let playerZ = 1;

    let accumulator = 0;
    let lastTime = 0;
    let frameCount = 0;
    let errorMessage = null;

    const keys = {
      w: false,
      a: false,
      s: false,
      d: false,
      Shift: false
    };

    const raycaster = new THREE.Raycaster();
    const tempMatrix = new THREE.Matrix4();

    // --------------------------------------------------
    // UTILITIES
    // --------------------------------------------------

    function worldX(x) {
      return (x - levelData.width / 2 + 0.5) * TILE_SIZE;
    }

    function worldZ(z) {
      return (z - levelData.height / 2 + 0.5) * TILE_SIZE;
    }

    function showError(error) {
      errorMessage = String(error?.stack || error);

      const panel = document.getElementById('debug-panel');
      panel.style.color = '#ff5555';
      panel.textContent = 'ERROR\n' + errorMessage;

      console.error(error);
    }

    function objectAt(x, z, type = null) {
      return gameObjects.find(obj =>
        obj.x === x &&
        obj.z === z &&
        (!type || obj.type === type)
      );
    }

    // --------------------------------------------------
    // GAME OBJECTS
    // --------------------------------------------------

    function createObject(type, x, z) {
      let geometry;
      let material;

      if (type === 'boulder') {
        geometry = new THREE.SphereGeometry(0.36, 20, 16);
        material = new THREE.MeshStandardMaterial({
          color: 0x777777,
          roughness: 0.9
        });
      } else {
        geometry = new THREE.OctahedronGeometry(0.25);
        material = new THREE.MeshStandardMaterial({
          color: 0x00ff66,
          emissive: 0x003311,
          metalness: 0.25,
          roughness: 0.2
        });
      }

      const mesh = new THREE.Mesh(geometry, material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.position.set(worldX(x), 0, worldZ(z));
      scene.add(mesh);

      const obj = {
        type,
        mesh,
        x,
        z,
        previousX: x,
        previousZ: z
      };

      gameObjects.push(obj);
      return obj;
    }

    // --------------------------------------------------
    // GRID
    // --------------------------------------------------

    function initGrid(levelData) {
      grid = Array.from(
        { length: levelData.height },
        () => Array(levelData.width).fill(EMPTY)
      );

      tiles = Array.from(
        { length: levelData.height },
        () => Array(levelData.width).fill(null)
      );

      // Rows are Z; columns are X.
      for (let z = 0; z < levelData.height; z++) {
        for (let x = 0; x < levelData.width; x++) {
          const cell = levelData.grid[z][x];

          grid[z][x] =
            cell === 'W' ? WALL :
            cell === 'D' ? DIRT :
            EMPTY;
        }
      }

      playerX = 1;
      playerZ = 1;

      for (const obj of levelData.objects) {
        if (obj.type === 'player') {
          playerX = obj.x;
          playerZ = obj.y;
        } else {
          createObject(obj.type, obj.x, obj.y);
        }
      }
    }

    function createGridMeshes() {
      const wallGeometry = new THREE.BoxGeometry(1, 1, 1);
      const wallMaterial = new THREE.MeshStandardMaterial({
        color: 0x555555
      });

      const dirtGeometry = new THREE.BoxGeometry(1, 0.12, 1);
      const dirtMaterial = new THREE.MeshStandardMaterial({
        color: 0x8b4513
      });

      for (let z = 0; z < levelData.height; z++) {
        for (let x = 0; x < levelData.width; x++) {
          let mesh = null;

          if (grid[z][x] === WALL) {
            mesh = new THREE.Mesh(wallGeometry, wallMaterial);
            mesh.position.set(worldX(x), 0, worldZ(z));
          } else if (grid[z][x] === DIRT) {
            mesh = new THREE.Mesh(dirtGeometry, dirtMaterial);
            mesh.position.set(worldX(x), -0.44, worldZ(z));
          }

          if (mesh) {
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            tiles[z][x] = mesh;
          }
        }
      }
    }

    function removeDirt(x, z) {
      if (grid[z][x] !== DIRT) return;

      if (tiles[z][x]) {
        scene.remove(tiles[z][x]);
        tiles[z][x] = null;
      }

      grid[z][x] = EMPTY;
    }

    // --------------------------------------------------
    // PLAYER
    // --------------------------------------------------

    function updateCameraPosition() {
      // Third-person view looking toward the board.
      camera.position.set(
        worldX(playerX),
        5.5,
        worldZ(playerZ) + 6
      );

      camera.lookAt(
        worldX(playerX),
        0,
        worldZ(playerZ)
      );
    }

    function movePlayer(dx, dz) {
      const x = playerX + dx;
      const z = playerZ + dz;

      if (
        x < 0 || x >= levelData.width ||
        z < 0 || z >= levelData.height
      ) return;

      if (grid[z][x] === WALL) return;

      // Boulder blocks movement.
      if (objectAt(x, z, 'boulder')) return;

      // Collect diamonds.
      const diamond = objectAt(x, z, 'diamond');

      if (diamond) {
        scene.remove(diamond.mesh);
        gameObjects = gameObjects.filter(obj => obj !== diamond);
        collectedDiamondCount++;

        // Check for level completion
        if (collectedDiamondCount >= initialDiamondCount && initialDiamondCount > 0) {
          completeLevel();
        }
      }

      // Walking through dirt digs it automatically.
      removeDirt(x, z);

      playerX = x;
      playerZ = z;

      updateCameraPosition();
    }

    // --------------------------------------------------
    // LEVEL COMPLETION
    // --------------------------------------------------

    function completeLevel() {
      // Show level completion message
      showLevelCompleteUI();

      // Wait briefly then proceed to next level (in a real game, you might wait for player input)
      setTimeout(() => {
        hideLevelCompleteUI();
        loadNextLevel();
      }, 2000); // 2 second delay to show completion message
    }

    function loadNextLevel() {
      currentLevelIndex++;
      if (currentLevelIndex >= LEVELS.length) {
        currentLevelIndex = 0; // Loop back to first level
      }

      // Reset game state for new level
      resetLevel();
    }

    function resetLevel() {
      // Clear existing game objects and meshes
      gameObjects.forEach(obj => {
        if (obj.mesh) {
          scene.remove(obj.mesh);
        }
      });
      gameObjects = [];

      // Clear existing tile meshes
      tiles.forEach(row => {
        row.forEach(tile => {
          if (tile) {
            scene.remove(tile);
          }
        });
      });

      // Reset tiles array
      tiles = Array.from(
        { length: levelData.height },
        () => Array(levelData.width).fill(null)
      );

      // Reload level data
      levelData = JSON.parse(JSON.stringify(LEVELS[currentLevelIndex]));
      initGrid(levelData);

      // Reset diamond counting
      initialDiamondCount = levelData.objects.filter(obj => obj.type === 'diamond').length;
      collectedDiamondCount = 0;

      // Recreate grid meshes
      createGridMeshes();

      // Reset player position (will be set in initGrid)
      updateCameraPosition();

      // Hide any UI and show debug panel
      hideUI();
      document.getElementById('debug-panel').style.display = 'block';
    }

    function digAdjacent(dx, dz) {
      const x = playerX + dx;
      const z = playerZ + dz;

      if (
        x < 0 || x >= levelData.width ||
        z < 0 || z >= levelData.height
      ) return;

      if (objectAt(x, z)) return;

      removeDirt(x, z);
    }

    // --------------------------------------------------
    // KEYBOARD
    // --------------------------------------------------

    function onKeyDown(event) {
      const keyMap = {
        KeyW: 'w',
        KeyA: 'a',
        KeyS: 's',
        KeyD: 'd',
        ShiftLeft: 'Shift',
        ShiftRight: 'Shift'
      };

      const key = keyMap[event.code];
      if (!key) return;

      event.preventDefault();

      // Avoid moving repeatedly from key-repeat events.
      if (keys[key]) return;

      keys[key] = true;

      if (key === 'Shift') return;

      const directions = {
        w: [0, -1],
        s: [0, 1],
        a: [-1, 0],
        d: [1, 0]
      };

      const [dx, dz] = directions[key];

      if (keys.Shift) {
        digAdjacent(dx, dz);
      } else {
        movePlayer(dx, dz);
      }
    }

    function onKeyUp(event) {
      const keyMap = {
        KeyW: 'w',
        KeyA: 'a',
        KeyS: 's',
        KeyD: 'd',
        ShiftLeft: 'Shift',
        ShiftRight: 'Shift'
      };

      const key = keyMap[event.code];

      if (key) keys[key] = false;
    }

    // --------------------------------------------------
    // BOULDER GRAVITY
    // --------------------------------------------------

    function updateLogic() {
      for (const obj of gameObjects) {
        obj.previousX = obj.x;
        obj.previousZ = obj.z;
      }

      // Reverse order prevents lower boulders being updated
      // before upper boulders in the same tick.
      const boulders = gameObjects
        .filter(obj => obj.type === 'boulder')
        .sort((a, b) => a.z - b.z);  // FIXED: was b.z - a.z, now a.z - b.z (ascending z)

      for (const boulder of boulders) {
        const x = boulder.x;
        const belowZ = boulder.z + 1;

        if (belowZ >= levelData.height) continue;

        // Stop on walls or dirt.
        if (grid[belowZ][x] !== EMPTY) continue;

        // Stop above another object or the player.
        if (objectAt(x, belowZ)) continue;

        if (playerX === x && playerZ === belowZ) continue;

        boulder.z = belowZ;
      }
    }

    // --------------------------------------------------
    // VR CONTROLLERS AND LASERS
    // --------------------------------------------------

    function createLaser(controller) {
      const geometry = new THREE.CylinderGeometry(
        0.003, 0.003, 1, 8
      );

      geometry.rotateX(Math.PI / 2);

      const material = new THREE.MeshBasicMaterial({
        color: 0xff3333
      });

      const laser = new THREE.Mesh(geometry, material);

      laser.position.z = -0.5;
      laser.scale.z = 5;
      laser.visible = false;

      controller.add(laser);
      return laser;
    }

    function onSelectStart(event) {
      const controller = event.target;
      const laser = controller === controller1 ? laser1 : laser2;

      if (laser) laser.visible = true;

      tempMatrix.identity().extractRotation(controller.matrixWorld);

      raycaster.ray.origin.setFromMatrixPosition(
        controller.matrixWorld
      );

      raycaster.ray.direction
        .set(0, 0, -1)
        .applyMatrix4(tempMatrix);

      const targets = gameObjects.map(obj => obj.mesh);
      const hits = raycaster.intersectObjects(targets, false);

      if (hits.length > 0) {
        const hitObject = gameObjects.find(
          obj => obj.mesh === hits[0].object
        );

        if (hitObject?.type === 'diamond') {
          hitObject.mesh.material.color.set(0xff0000);
        }
      }
    }

    function onSelectEnd(event) {
      const controller = event.target;
      const laser = controller === controller1 ? laser1 : laser2;

      if (laser) laser.visible = false;

      for (const obj of gameObjects) {
        if (obj.type === 'diamond') {
          obj.mesh.material.color.set(0x00ff66);
        }
      }
    }

    function updateLaser(controller, laser) {
      if (!controller || !laser || !laser.visible) return;

      tempMatrix.identity().extractRotation(controller.matrixWorld);

      raycaster.ray.origin.setFromMatrixPosition(
        controller.matrixWorld
      );

      raycaster.ray.direction
        .set(0, 0, -1)
        .applyMatrix4(tempMatrix);

      const targets = gameObjects.map(obj => obj.mesh);

      for (const row of tiles) {
        for (const tile of row) {
          if (tile) targets.push(tile);
        }
      }

      const hits = raycaster.intersectObjects(targets, false);
      const distance = hits.length
        ? Math.min(hits[0].distance, 5)
        : 5;

      laser.scale.z = distance;
      laser.position.z = -distance / 2;
    }

    // --------------------------------------------------
    // DEBUG PANEL
    // --------------------------------------------------

    function updateDebugPanel() {
      if (errorMessage) return;

      const panel = document.getElementById('debug-panel');

      panel.textContent =
        `Three.js: ${THREE.REVISION}\n` +
        `Level: ${currentLevelIndex + 1}/${LEVELS.length}\n` +
        `Player: (${playerX}, ${playerZ})\n` +
        `Diamonds: ${collectedDiamondCount}/${initialDiamondCount}\n` +
        `Objects: ${gameObjects.length}\n` +
        `Boulders: ${gameObjects.filter(o => o.type === 'boulder').length}\n` +
        `VR active: ${renderer.xr.isPresenting}\n` +
        `Frame: ${frameCount}`;
    }

    // --------------------------------------------------
    // UI FUNCTIONS
    // --------------------------------------------------

    function showLevelCompleteUI() {
      // Create or show level completion overlay
      let overlay = document.getElementById('level-complete-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'level-complete-overlay';
        overlay.style.position = 'absolute';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100%';
        overlay.style.height = '100%';
        overlay.style.backgroundColor = 'rgba(0, 0, 0, 0.7)';
        overlay.style.color = '#00ff00';
        overlay.style.display = 'flex';
        overlay.style.flexDirection = 'column';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.fontSize = '24pt';
        overlay.style.zIndex = '1000';
        overlay.style.textAlign = 'center';
        overlay.style.padding = '20px';
        overlay.style.boxSizing = 'border-box';
        document.body.appendChild(overlay);
      }

      overlay.innerHTML = `
        <div>Level Complete!</div>
        <div>Collected ${collectedDiamondCount}/${initialDiamondCount} diamonds</div>
        <div>Loading next level...</div>
      `;
      overlay.style.display = 'flex';
    }

    function hideLevelCompleteUI() {
      const overlay = document.getElementById('level-complete-overlay');
      if (overlay) {
        overlay.style.display = 'none';
      }
    }

    function showLevelSelectionUI() {
      // Create or show level selection overlay
      let overlay = document.getElementById('level-selection-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'level-selection-overlay';
        overlay.style.position = 'absolute';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100%';
        overlay.style.height = '100%';
        overlay.style.backgroundColor = 'rgba(0, 0, 0, 0.8)';
        overlay.style.color = '#00ff00';
        overlay.style.display = 'flex';
        overlay.style.flexDirection = 'column';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.fontSize = '18pt';
        overlay.style.zIndex = '1000';
        overlay.style.textAlign = 'center';
        overlay.style.padding = '20px';
        overlay.style.boxSizing = 'border-box';
        document.body.appendChild(overlay);
      }

      let levelListHTML = '<div>Select Level</div>';
      LEVELS.forEach((level, index) => {
        levelListHTML += `<div class="level-option" data-index="${index}">Level ${index + 1}</div>`;
      });

      overlay.innerHTML = levelListHTML + '<div style="margin-top: 20px; font-size: 14pt;">Use number keys 1-9 to select</div>';
      overlay.style.display = 'flex';

      // Add click handlers to level options
      setTimeout(() => {
        document.querySelectorAll('.level-option').forEach(option => {
          option.addEventListener('click', () => {
            const index = parseInt(option.getAttribute('data-index'));
            if (index !== currentLevelIndex) {
              currentLevelIndex = index;
              hideLevelSelectionUI();
              resetLevel();
            }
          });

          // Add hover effect
          option.addEventListener('mouseenter', () => {
            option.style.color = '#ffff00';
          });
          option.addEventListener('mouseleave', () => {
            option.style.color = '#00ff00';
          });
        });
      }, 100);
    }

    function hideLevelSelectionUI() {
      const overlay = document.getElementById('level-selection-overlay');
      if (overlay) {
        overlay.style.display = 'none';
      }
    }

    function hideUI() {
      hideLevelCompleteUI();
      hideLevelSelectionUI();
    }

    // --------------------------------------------------
    // ANIMATION LOOP
    // --------------------------------------------------

    function animate(timeMs) {
      try {
        const time = timeMs / 1000;

        if (lastTime === 0) lastTime = time;

        const delta = Math.min(time - lastTime, 0.25);
        lastTime = time;
        accumulator += delta;

        while (accumulator >= TICK) {
          updateLogic();
          accumulator -= TICK;
        }

        const alpha = accumulator / TICK;

        for (const obj of gameObjects) {
          const x = obj.previousX +
            (obj.x - obj.previousX) * alpha;

          const z = obj.previousZ +
            (obj.z - obj.previousZ) * alpha;

          obj.mesh.position.set(
            worldX(x),
            0,
            worldZ(z)
          );
        }

        updateLaser(controller1, laser1);
        updateLaser(controller2, laser2);

        renderer.render(scene, camera);

        frameCount++;
        updateDebugPanel();
      } catch (error) {
        showError(error);
      }
    }

    // --------------------------------------------------
    // INITIALIZATION
    // --------------------------------------------------

    function init() {
      try {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        camera = new THREE.PerspectiveCamera(
          50,
          window.innerWidth / window.innerHeight,
          0.1,
          100
        );

        // Load current level data
        levelData = JSON.parse(JSON.stringify(LEVELS[currentLevelIndex]));
        initGrid(levelData);

        // Initialize diamond counting for level completion
        initialDiamondCount = levelData.objects.filter(obj => obj.type === 'diamond').length;
        collectedDiamondCount = 0;

        createGridMeshes();
        updateCameraPosition();

        const hemisphereLight = new THREE.HemisphereLight(
          0xffffff, 0x444444, 1.5
        );
        scene.add(hemisphereLight);

        const directionalLight = new THREE.DirectionalLight(
          0xffffff, 2
        );

        directionalLight.position.set(-3, 10, -10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        renderer = new THREE.WebGLRenderer({
          antialias: true
        });

        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.shadowMap.enabled = true;

        document.body.appendChild(renderer.domElement);

        document.getElementById('vr-button').appendChild(
          VRButton.createButton(renderer, {
            optionalFeatures: ['local-floor', 'bounded-floor']
          })
        );

        controller1 = renderer.xr.getController(0);
        controller1.addEventListener('selectstart', onSelectStart);
        controller1.addEventListener('selectend', onSelectEnd);
        scene.add(controller1);

        controller2 = renderer.xr.getController(1);
        controller2.addEventListener('selectstart', onSelectStart);
        controller2.addEventListener('selectend', onSelectEnd);
        scene.add(controller2);

        laser1 = createLaser(controller1);
        laser2 = createLaser(controller2);

        window.addEventListener('keydown', onKeyDown);
        window.addEventListener('keyup', onKeyUp);

        window.addEventListener('blur', () => {
          for (const key in keys) keys[key] = false;
        });

        window.addEventListener('resize', () => {
          camera.aspect =
            window.innerWidth / window.innerHeight;

          camera.updateProjectionMatrix();

          renderer.setSize(
            window.innerWidth,
            window.innerHeight
          );
        });

        // Show level selection UI on start
        showLevelSelectionUI();

        // Handle number key presses for level selection
        window.addEventListener('keydown', (event) => {
          // Only process number keys when level selection UI is visible
          const levelSelectionOverlay = document.getElementById('level-selection-overlay');
          if (levelSelectionOverlay && levelSelectionOverlay.style.display !== 'none') {
            const key = event.key;
            if (key >= '1' && key <= '9') {
              const levelIndex = parseInt(key) - 1;
              if (levelIndex >= 0 && levelIndex < LEVELS.length && levelIndex !== currentLevelIndex) {
                currentLevelIndex = levelIndex;
                hideLevelSelectionUI();
                resetLevel();
              }
            }
          }
        });

        renderer.setAnimationLoop(animate);
      } catch (error) {
        showError(error);
      }
    }

    init();
  </script>
</body>
</html>
